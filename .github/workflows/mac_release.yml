name: MacOS Release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: false
  push:
    branches:
      - release-7.2.9
    tags:
      - 'v*'

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  macos:
    name: MacOS
    runs-on: macos-latest
    timeout-minutes: 355

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew install automake libtool meson nasm ninja pkg-config || true

          # Disable spotlight.
          sudo mdutil -a -i off || true

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          # Report every compile error in one run, not only the first one.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -version
          df -h .

      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-release-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-release-libs-

      - name: Libraries.
        id: libs
        timeout-minutes: 270
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Free up some disk space.
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete || true

      - name: Save libraries cache.
        # Saved even when the libraries step times out, so the next run
        # continues from the last finished stage instead of starting over.
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-release-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}${{ steps.libs.outcome != 'success' && format('-partial-{0}', github.run_id) || '' }}

      - name: AyuGram build.
        run: |
          cd $REPO_NAME/Telegram

          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ../out --config Release --parallel

      - name: Package.
        run: |
          VERSION=$(grep '^AppVersionStrSmall' $REPO_NAME/Telegram/build/version | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cd $REPO_NAME/out/Release
          ls
          codesign --force --deep --sign - AyuGram.app
          lipo -info AyuGram.app/Contents/MacOS/AyuGram
          mkdir -p dist dmg
          ditto -c -k --sequesterRsrc --keepParent AyuGram.app dist/AyuGram-$VERSION-macos.zip
          cp -R AyuGram.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "AyuGram $VERSION" -srcfolder dmg -ov -format UDZO dist/AyuGram-$VERSION-macos.dmg
          shasum -a 256 dist/*

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-${{ env.VERSION }}-macos
          path: ${{ env.REPO_NAME }}/out/Release/dist/
          retention-days: 14

      - name: Publish release.
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd $REPO_NAME
          TAG=v$VERSION
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG \
            --target "$GITHUB_SHA" \
            --title "AyuGram $VERSION (macOS)" \
            --notes "Unofficial macOS build: AyuGram merged with Telegram Desktop $VERSION. Ad-hoc signed, not notarized: on first launch right-click AyuGram.app → Open, or run \`xattr -cr /Applications/AyuGram.app\`."
          gh release upload $TAG out/Release/dist/* --clobber
